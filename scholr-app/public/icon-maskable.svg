<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mbase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6B84D"/>
      <stop offset="0.55" stop-color="#EE9A36"/>
      <stop offset="1" stop-color="#DC7E22"/>
    </linearGradient>
    <radialGradient id="mglow" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3210"/>
      <stop offset="1" stop-color="#6B4A1C"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background -->
  <rect width="512" height="512" fill="url(#mbase)"/>
  <rect width="512" height="512" fill="url(#mglow)"/>
  <!-- monogram within ~80% safe zone -->
  <text x="50%" y="53%" dominant-baseline="central" text-anchor="middle"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="240" font-weight="800" letter-spacing="-8" fill="url(#mink)">S</text>
</svg>
